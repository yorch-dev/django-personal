services:
  db_dev:
    image: postgres:18
    container_name: django-db-dev
    env_file:
      - .env.dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - django_db_dev:/var/lib/postgresql
    ports:
      - "5434:5432"
    restart: unless-stopped

  web_dev:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: django-web-dev
    env_file:
      - .env.dev
    depends_on:
      db_dev:
        condition: service_healthy
    volumes:
      - .:/app
      - django_venv_dev:/app/.venv
      - django_uv_cache_dev:/app/.cache/uv
    ports:
      - "8004:8000"
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      sh -c '
        set -e;
        uv sync --frozen --no-dev;
        python manage.py migrate --noinput;
        python manage.py runserver 0.0.0.0:8000
      '
    restart: unless-stopped

  db_prod:
    image: postgres:18
    container_name: django-db-prod
    env_file:
      - .env.prod
    volumes:
      - django_db_prod:/var/lib/postgresql
    ports:
      - "5435:5432"
    restart: unless-stopped

  web_prod:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: django-web-prod
    env_file:
      - .env.prod
    depends_on:
      - db_prod
    ports:
      - "8005:8000"
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "python manage.py collectstatic --noinput && gunicorn base_django.wsgi:application --bind 0.0.0.0:8000 --workers 3 --log-file -"
    restart: unless-stopped

volumes:
  django_db_dev:
  django_db_prod:
  django_venv_dev:
  django_uv_cache_dev:
